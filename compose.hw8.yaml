services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: s7801-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: s7801-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic s7801_entity_requests \
          --partitions 1 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic s7801_entity_responses \
          --partitions 1 \
          --replication-factor 1

        echo "Homework 8 Part 1 topics created."

  hw8-worker:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    container_name: s7801-hw8-worker
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HW8_REQUEST_TOPIC: s7801_entity_requests
      HW8_RESPONSE_TOPIC: s7801_entity_responses
      HW8_WORKER_GROUP: s7801_entity_worker_group
    command:
      - python
      - -m
      - code.hw8_worker
    restart: unless-stopped

  hw8-api:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    container_name: s7801-hw8-api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      hw8-worker:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HW8_REQUEST_TOPIC: s7801_entity_requests
      HW8_RESPONSE_TOPIC: s7801_entity_responses
      HW8_API_TIMEOUT_SECONDS: 15
    command:
      - python
      - -m
      - uvicorn
      - code.hw8_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8601"
    ports:
      - "8601:8601"
    restart: unless-stopped
