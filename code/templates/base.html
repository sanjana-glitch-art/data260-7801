<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        Clinical Trial Portal
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">
    <nav
        class="navbar navbar-expand-lg navbar-dark bg-primary"
    >
        <div class="container">
            <a
                class="navbar-brand fw-semibold"
                href="/"
            >
                Clinical Trial Portal
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavigation"
                aria-controls="mainNavigation"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div 
                class="collapse navbar-collapse"
                id="mainNavigation"
            >
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/"
                        >
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/trials"
                        >
                            Trial Listings
                        </a>
                    </li>

                    {% if user %}
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/dashboard"
                        >
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/logout"
                        >
                            Log out
                        </a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/login"
                        >
                            Log in
                        </a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-top bg-white py-4">
        <div class="container text-center text-secondary">
            DATA-260 · Clinical Trial Listings · SID4 7801
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
</body>
</html>
